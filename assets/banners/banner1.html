<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1290px; height: 2796px; overflow: hidden; font-family: -apple-system, 'SF Pro Display', sans-serif; }
  .banner {
    width: 1290px; height: 2796px;
    background: linear-gradient(170deg, #4A90D9 0%, #1a3a6c 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 160px 80px 0;
    position: relative;
    overflow: hidden;
  }
  .deco1 { position: absolute; top: -100px; right: -100px; width: 500px; height: 500px; border-radius: 250px; background: rgba(255,255,255,0.06); }
  .deco2 { position: absolute; bottom: 200px; left: -150px; width: 400px; height: 400px; border-radius: 200px; background: rgba(255,255,255,0.04); }
  .deco3 { position: absolute; top: 600px; right: -80px; width: 300px; height: 300px; border-radius: 150px; background: rgba(123,196,168,0.1); }

  .verb {
    font-size: 180px; font-weight: 900; color: #fff;
    text-align: center; letter-spacing: -4px;
    line-height: 0.9;
    text-transform: uppercase;
  }
  .noun {
    font-size: 100px; font-weight: 700; color: rgba(255,255,255,0.85);
    text-align: center; letter-spacing: -2px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: 48px; font-weight: 500; color: rgba(255,255,255,0.7);
    text-align: center; line-height: 1.4;
    margin-bottom: 80px;
  }
  .phone-container {
    position: relative;
    transform: perspective(1200px) rotateY(-4deg) rotateX(2deg);
  }
  .screenshot-frame {
    width: 860px;
    border-radius: 56px;
    overflow: hidden;
    box-shadow: 0 60px 140px rgba(0,0,0,0.45), 0 0 0 4px rgba(255,255,255,0.1);
  }
  .screenshot-frame img {
    width: 100%; display: block;
  }
  .float-emoji {
    position: absolute;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,0.4));
  }
  .e1 { font-size: 180px; top: -80px; left: -100px; transform: rotate(-15deg); }
  .e2 { font-size: 120px; top: 60px; right: -80px; transform: rotate(12deg); }
  .e3 { font-size: 150px; top: 480px; left: -110px; transform: rotate(-20deg); }
  .e4 { font-size: 100px; top: 380px; right: -70px; transform: rotate(25deg); }
  .e5 { font-size: 160px; bottom: 580px; left: -90px; transform: rotate(8deg); }
  .e6 { font-size: 130px; bottom: 280px; right: -90px; transform: rotate(-18deg); }
  .e7 { font-size: 90px; top: 230px; left: -50px; transform: rotate(30deg); }
  .e8 { font-size: 110px; bottom: 80px; left: 40px; transform: rotate(-10deg); }
</style>
</head>
<body>
<div class="banner">
  <div class="deco1"></div>
  <div class="deco2"></div>
  <div class="deco3"></div>

  <div class="verb">BREATHE</div>
  <div class="noun">Better. Feel Better.</div>
  <div class="subtitle">10 science-backed techniques for<br>calm, sleep, focus & energy</div>

  <div class="phone-container">
    <div class="float-emoji e1">🧘</div>
    <div class="float-emoji e2">✨</div>
    <div class="float-emoji e3">🌿</div>
    <div class="float-emoji e4">💫</div>
    <div class="float-emoji e5">🍃</div>
    <div class="float-emoji e6">💤</div>
    <div class="float-emoji e7">🌟</div>
    <div class="float-emoji e8">🫧</div>
    <div class="screenshot-frame">
      <img src="../1.png" />
    </div>
  </div>
</div>
</body>
</html>
